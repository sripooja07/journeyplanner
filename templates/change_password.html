<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Crowdedness Journey Planner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
        }

        header {
            background: #123b63;
            color: white;
            text-align: center;
            padding: 22px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            margin: 60px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #123b63;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #123b63;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e4f7e;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message:not(.success):not(.error) {
            background: #e0f2fe;
            color: #075985;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .password-note {
            font-size: 12px;
            color: #64748b;
            margin-top: -12px;
            margin-bottom: 18px;
        }

    </style>

</head>

<body>

<header>

    <h1>Crowdedness-Aware Journey Planner</h1>

</header>

<div class="container">

    <h2>Change Password</h2>

    <p class="subtitle">
        Update your account password securely.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="message {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}">

        <label>Current Password</label>

        <input
            type="password"
            name="current_password"
            placeholder="Enter current password"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <p class="password-note">
            Password must contain at least 8 characters.
        </p>

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">
            Update Password
        </button>

    </form>

    <a href="{{ url_for('home') }}" class="back-link">
        ← Back to Home
    </a>

</div>

</body>

</html>
